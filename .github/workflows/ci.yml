name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      arch:
        description: "Android architecture to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64_v8a
          - armeabi_v7a
      publish:
        description: "Upload to latest release"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

env:
  VALENCE_VERSION: '1.2.3'
  DISCORD_VERSION_CODE: '352206'
  BUNDLE_PUBLIC_KEY: 'db74a921941576bf70cc1c2777741fb202131a76758ffd3ffcc785f9e76ff119'
  RESEAM_VERSION: '0.30.1'
  APKEDITOR_VERSION: '1.4.9'
  DISCORD_MIRROR: 'https://proxy.vd.ushie.dev'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (inputs.arch == '' || inputs.arch == 'all') && fromJSON('["arm64_v8a", "armeabi_v7a"]') || fromJSON(inputs.arch) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Reseam CLI
        run: |
          echo "Installing Reseam CLI v${RESEAM_VERSION}..."
          wget -q "https://cdn.reseam.app/engine/v${RESEAM_VERSION}/reseam-linux-x64" -O reseam
          chmod +x reseam
          ./reseam --version

      - name: Setup Android SDK build-tools
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools"
          if [ -d "${BUILD_TOOLS_DIR}" ]; then
            LATEST_BT=$(ls "${BUILD_TOOLS_DIR}" | sort -V | tail -1)
            echo "Android build-tools: ${LATEST_BT}"
            echo "${BUILD_TOOLS_DIR}/${LATEST_BT}" >> $GITHUB_PATH
          else
            echo "build-tools dir not found, installing..."
            mkdir -p "${BUILD_TOOLS_DIR}"
            wget -q "https://dl.google.com/android/repository/build-tools_34.0.0-linux.zip" -O /tmp/bt.zip
            cd /tmp && unzip -q -o bt.zip
            cp -r /tmp/34.0.0/* "${BUILD_TOOLS_DIR}/34.0.0/"
            cd -
            rm -rf /tmp/bt.zip /tmp/34.0.0
            echo "${BUILD_TOOLS_DIR}/34.0.0" >> $GITHUB_PATH
          fi
          echo "zipalign: $(which zipalign 2>/dev/null || echo 'NOT FOUND')"
          echo "apksigner: $(which apksigner 2>/dev/null || echo 'NOT FOUND')"
          echo "unzip: $(which unzip 2>/dev/null || echo 'NOT FOUND')"
          echo "zip: $(which zip 2>/dev/null || echo 'NOT FOUND')"

      - name: Download APKEditor
        run: |
          echo "Downloading APKEditor v${APKEDITOR_VERSION}..."
          wget -q --show-progress "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar" -O APKEditor.jar
          echo "Checking SHA256..."
          echo "a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67 APKEditor.jar" | sha256sum -c -
          echo "Running APKEditor version check (non-fatal)..."
          java -jar APKEditor.jar -v 2>&1 || echo "APKEditor -v check returned non-zero exit code"

      - name: Download Discord APKs
        run: |
          mkdir -p downloads/discord
          cd downloads/discord

          echo "Downloading Discord v${DISCORD_VERSION_CODE} (${{ matrix.arch }})..."
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/base" -O base.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.${{ matrix.arch }}" -O "config.${{ matrix.arch }}.apk"
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.en" -O config.en.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.xxhdpi" -O config.xxhdpi.apk

          echo "Downloaded Discord APKs:"
          ls -la *.apk

      - name: Download Valenced assets
        run: |
          mkdir -p downloads/valenced
          VALENCE_BASE="https://github.com/Valenced/valenced/releases/download/${VALENCE_VERSION}"

          echo "Downloading Valenced ${VALENCE_VERSION}..."
          wget -q "${VALENCE_BASE}/valenced.reseam" -O downloads/valenced/valenced.reseam
          wget -q "${VALENCE_BASE}/app-release.apk" -O downloads/valenced/app-release.apk

          echo "Downloaded Valenced assets:"
          ls -la downloads/valenced/

      - name: Verify bundle
        run: |
          echo "Verifying Valenced patch bundle..."
          ./reseam bundle list downloads/valenced/valenced.reseam

      - name: Generate signing key
        run: |
          mkdir -p keys
          echo "Generating signing key..."
          ./reseam bundle keygen --out keys/valenced
          echo "Signing key generated:"
          ls -la keys/

      - name: Patch Discord
        run: |
          mkdir -p output

          echo "Patching Discord with Valenced..."
          ./reseam patch downloads/discord/base.apk \
            --split "downloads/discord/config.${{ matrix.arch }}.apk" \
            --split "downloads/discord/config.en.apk" \
            --split "downloads/discord/config.xxhdpi.apk" \
            --bundle "downloads/valenced/valenced.reseam" \
            --trust "${BUNDLE_PUBLIC_KEY}" \
            --preset all \
            --option "Valenced.module=downloads/valenced/app-release.apk" \
            --option "Change package name.packageName=app.valenced" \
            --option "Change app name.appName=Valenced" \
            --key keys/valenced.pk8 \
            --cert keys/valenced.der \
            --output-dir output/

          echo "Patched APKs:"
          ls -la output/

      - name: Merge split APKs into single APK
        run: |
          ARCH="${{ matrix.arch }}"
          echo "Merging split APKs into a single APK for ${ARCH}..."

          mkdir -p merge
          cp output/base.apk merge/
          cp "output/config.${ARCH}.apk" merge/
          cp output/config.en.apk merge/
          cp output/config.xxhdpi.apk merge/
          echo "Files in merge:"
          ls -la merge/

          # Try APKEditor merge (known issue: APKEditor 1.4.9 fails with resource linking error on patched APKs)
          # Falls back to manual zip merge if APKEditor fails
          set +e
          java -jar APKEditor.jar m -i merge/ -o output/merged.apk > /tmp/apkeditor.log 2>&1
          MERGE_EXIT=$?
          set -e

          if [ ${MERGE_EXIT} -ne 0 ]; then
            echo "::warning::APKEditor merge failed (exit ${MERGE_EXIT}), using manual zip merge"

            # Manual merge: extract base.apk, then add config APKs without overwriting
            rm -rf merge_temp
            mkdir -p merge_temp

            # Extract base APK
            unzip -o merge/base.apk -d merge_temp/ || echo "ERROR: unzip of base.apk failed"

            # Add config APK files without overwriting base files
            for apk in merge/config.*.apk; do
              [ -f "$apk" ] && unzip -n "$apk" -d merge_temp/ || true
            done

            # Remove old signature before repackaging
            rm -rf merge_temp/META-INF

            # Repackage using zip (preferred) or jar (fallback)
            MERGE_OK=false
            (cd merge_temp && zip -r -q -X ../output/merged.apk .) 2>&1
            if [ $? -eq 0 ] && [ -f output/merged.apk ]; then
              MERGE_OK=true
            else
              rm -f output/merged.apk
              rm -f /tmp/merged_apk.jar
              jar cf /tmp/merged_apk.jar -C merge_temp . 2>&1 || true
              if [ -f /tmp/merged_apk.jar ]; then
                cp /tmp/merged_apk.jar output/merged.apk
                MERGE_OK=true
              fi
            fi

            if [ "$MERGE_OK" = true ]; then
              echo "::notice::Manual zip merge succeeded, APK size: $(stat -c '%s' output/merged.apk 2>/dev/null || echo 'unknown') bytes"
            else
              echo "::error::Manual zip merge also failed!"
              exit 1
            fi
          fi

          echo "Merged APK: $(ls -la output/merged.apk 2>&1)"

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merge-debug-${{ matrix.arch }}
          path: /tmp/apkeditor.log
          if-no-files-found: ignore

      - name: Zipalign and sign the single APK
        run: |
          echo "Zipaligning and signing the merged APK..."

          # Zipalign (4-byte alignment)
          ZIPALIGN_OUTPUT=$(zipalign -f 4 output/merged.apk output/valenced.apk 2>&1)
          ZIPALIGN_EXIT=$?

          if [ ${ZIPALIGN_EXIT} -ne 0 ]; then
            echo "::error::zipalign failed (exit ${ZIPALIGN_EXIT}). Output: ${ZIPALIGN_OUTPUT}"
            exit ${ZIPALIGN_EXIT}
          fi

          # Sign with apksigner
          APKSIGNER_OUTPUT=$(apksigner sign --key keys/valenced.pk8 --cert keys/valenced.der output/valenced.apk 2>&1)
          APKSIGNER_EXIT=$?

          if [ ${APKSIGNER_EXIT} -ne 0 ]; then
            echo "::error::apksigner sign failed (exit ${APKSIGNER_EXIT}). Output: ${APKSIGNER_OUTPUT}"
            exit ${APKSIGNER_EXIT}
          fi

          # Verify the signature
          VERIFY_OUTPUT=$(apksigner verify --verbose output/valenced.apk 2>&1)
          VERIFY_EXIT=$?

          if [ ${VERIFY_EXIT} -ne 0 ]; then
            echo "::error::apksigner verify failed (exit ${VERIFY_EXIT}). Output: ${VERIFY_OUTPUT}"
            exit ${VERIFY_EXIT}
          fi

          echo "Signed single APK:"
          ls -la output/valenced.apk

      - name: Verify output
        run: |
          if [ ! -f output/valenced.apk ]; then
            echo "Error: Single APK was not produced!"
            exit 1
          fi
          echo "Output verification passed."
          ls -la output/valenced.apk

      - name: Package single APK
        if: inputs.publish == true || github.event_name == 'release'
        run: |
          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          mkdir -p package

          cp output/valenced.apk "package/valenced.apk"
          cp keys/valenced.pk8 "package/signing.pk8"
          cp keys/valenced.der "package/signing.der"

          printf 'Pre-patched Discord with Valenced\n=================================\nValence version: %s\nDiscord version: 352.6 - Alpha\nArchitecture: %s\n\nInstallation:\n  1. Extract valenced.apk from the archive\n  2. Install directly on your Android device:\n      adb install -r valenced.apk\n\n  Or copy the APK to your phone and open it with any file manager.\n\nSigning key:\n  - signing.pk8 / signing.der\n  - Keep these files! You need them to update the app later (same signing key required)\n  - If you lose them, you will need to uninstall and reinstall the app\n\nNotes:\n  - This installs alongside the official Discord app as "Valenced" (package: app.valenced)\n' "${VALENCE_VERSION}" "${ARCH}" > "package/INSTALL.txt"

          cd package
          zip -r "../${ZIP_NAME}" .

          echo "Package created: ${ZIP_NAME}"
          ls -la "../${ZIP_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: patched-${{ matrix.arch }}
          path: |
            output/valenced.apk
            keys/valenced.pk8
            keys/valenced.der
          if-no-files-found: error

      - name: Upload release asset
        if: inputs.publish == true || github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          echo "Checking for ZIP file..."
          ls -la "${ZIP_NAME}" 2>&1 || echo "ZIP file not found at repo root"

          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Finding latest release..."
            TAG_NAME=$(gh release view --limit 1 --json tagName --jq '.tagName' 2>&1)
            echo "Found release: ${TAG_NAME}"
            if [ -z "$TAG_NAME" ]; then
              echo "Creating release..."
              TAG_NAME="${VALENCE_VERSION}"
              gh release create "$TAG_NAME" --title "Pre-patched Discord ${VALENCE_VERSION}" --notes "Pre-patched Discord with Valenced ${VALENCE_VERSION}"
            fi
          fi

          echo "Uploading ${ZIP_NAME} to release ${TAG_NAME}..."
          set +e
          UPLOAD_OUTPUT=$(gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber 2>&1)
          UPLOAD_EXIT=$?
          set -e

          if [ ${UPLOAD_EXIT} -ne 0 ]; then
            echo "::error::Release upload failed (exit ${UPLOAD_EXIT}). Output: ${UPLOAD_OUTPUT}"
            exit ${UPLOAD_EXIT}
          fi
          echo "Upload succeeded"