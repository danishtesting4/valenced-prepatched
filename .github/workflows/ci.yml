name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      arch:
        description: "Android architecture to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64_v8a
          - armeabi_v7a
      publish:
        description: "Upload to latest release"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

env:
  VALENCE_VERSION: '1.2.3'
  DISCORD_VERSION_CODE: '352206'
  BUNDLE_PUBLIC_KEY: 'db74a921941576bf70cc1c2777741fb202131a76758ffd3ffcc785f9e76ff119'
  RESEAM_VERSION: '0.30.1'
  APKEDITOR_VERSION: '1.4.9'
  DISCORD_MIRROR: 'https://proxy.vd.ushie.dev'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (inputs.arch == '' || inputs.arch == 'all') && fromJSON('["arm64_v8a", "armeabi_v7a"]') || fromJSON(inputs.arch) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Reseam CLI
        run: |
          echo "Installing Reseam CLI v${RESEAM_VERSION}..."
          wget -q "https://cdn.reseam.app/engine/v${RESEAM_VERSION}/reseam-linux-x64" -O reseam
          chmod +x reseam
          ./reseam --version

      - name: Setup Android SDK build-tools
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools"
          if [ -d "${BUILD_TOOLS_DIR}" ]; then
            LATEST_BT=$(ls "${BUILD_TOOLS_DIR}" | sort -V | tail -1)
            BT_PATH="${BUILD_TOOLS_DIR}/${LATEST_BT}"
            echo "Android build-tools: ${LATEST_BT}"
            echo "BT_PATH: ${BT_PATH}"
            echo "${BT_PATH}" >> $GITHUB_PATH
            ls "${BT_PATH}"
          else
            echo "build-tools dir not found, installing..."
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" 2>&1 || true
            echo "${BUILD_TOOLS_DIR}/34.0.0" >> $GITHUB_PATH
          fi
          echo "zipalign: $(which zipalign 2>/dev/null || echo 'NOT FOUND')"
          echo "apksigner: $(which apksigner 2>/dev/null || echo 'NOT FOUND')"

      - name: Download APKEditor
        run: |
          echo "Downloading APKEditor v${APKEDITOR_VERSION}..."
          wget -q "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar" -O APKEditor.jar
          echo "APKEditor downloaded:"
          ls -la APKEditor.jar

      - name: Download Discord APKs
        run: |
          mkdir -p downloads/discord
          cd downloads/discord

          echo "Downloading Discord v${DISCORD_VERSION_CODE} (${{ matrix.arch }})..."
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/base" -O base.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.${{ matrix.arch }}" -O "config.${{ matrix.arch }}.apk"
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.en" -O config.en.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.xxhdpi" -O config.xxhdpi.apk

          echo "Downloaded Discord APKs:"
          ls -la *.apk

      - name: Download Valenced assets
        run: |
          mkdir -p downloads/valenced
          VALENCE_BASE="https://github.com/Valenced/valenced/releases/download/${VALENCE_VERSION}"

          echo "Downloading Valenced ${VALENCE_VERSION}..."
          wget -q "${VALENCE_BASE}/valenced.reseam" -O downloads/valenced/valenced.reseam
          wget -q "${VALENCE_BASE}/app-release.apk" -O downloads/valenced/app-release.apk

          echo "Downloaded Valenced assets:"
          ls -la downloads/valenced/

          echo "SHA-256 verification:"
          sha256sum downloads/valenced/*

      - name: Verify bundle
        run: |
          echo "Verifying Valenced patch bundle..."
          ./reseam bundle list downloads/valenced/valenced.reseam

      - name: Generate signing key
        run: |
          mkdir -p keys
          echo "Generating signing key..."
          ./reseam bundle keygen --out keys/valenced
          echo "Signing key generated. Full listing:"
          ls -la keys/
          echo "Checking for .pk8 and .der files:"
          ls -la keys/valenced.pk8 2>&1 || echo "WARNING: valenced.pk8 not found!"
          ls -la keys/valenced.der 2>&1 || echo "WARNING: valenced.der not found!"

      - name: Patch Discord
        run: |
          mkdir -p output

          echo "Patching Discord with Valenced..."
          ./reseam patch downloads/discord/base.apk \
            --split "downloads/discord/config.${{ matrix.arch }}.apk" \
            --split "downloads/discord/config.en.apk" \
            --split "downloads/discord/config.xxhdpi.apk" \
            --bundle "downloads/valenced/valenced.reseam" \
            --trust "${BUNDLE_PUBLIC_KEY}" \
            --preset all \
            --option "Valenced.module=downloads/valenced/app-release.apk" \
            --option "Change package name.packageName=app.valenced" \
            --option "Change app name.appName=Valenced" \
            --key keys/valenced.pk8 \
            --cert keys/valenced.der \
            --output-dir output/

          echo "Patched APKs:"
          ls -la output/
          echo "Signing key files:"
          ls -la keys/
          echo "Checking pk8/der after patch:"
          ls -la keys/valenced.pk8 2>&1 || echo "WARNING: valenced.pk8 not found!"
          ls -la keys/valenced.der 2>&1 || echo "WARNING: valenced.der not found!"

      - name: Merge split APKs into single APK
        run: |
          ARCH="${{ matrix.arch }}"
          echo "Merging split APKs into a single APK for ${ARCH}..."

          # Show all output files from patch
          echo "=== Files in output/ ==="
          ls -la output/
          ::notice::APK files in output/: $(ls output/*.apk 2>&1 || echo "none")"

          # Copy all APK files to a merge directory
          mkdir -p merge
          cp output/*.apk merge/ 2>&1 || echo "::error::No APK files found in output/"
          echo "::notice::Files in merge/: $(ls merge/ 2>&1 || echo "empty")"

          # Verify APKEditor works
          echo "=== APKEditor version ==="
          java -jar APKEditor.jar -v 2>&1 || echo "::error::APKEditor version check failed"

          # Merge splits using APKEditor with force flag
          echo "=== Running APKEditor merge ==="
          set +e
          java -jar APKEditor.jar m -f -i merge/ -o output/merged.apk 2>&1
          MERGE_EXIT=$?
          set -e
          echo "::notice::APKEditor exit code: ${MERGE_EXIT}"

          if [ ${MERGE_EXIT} -ne 0 ]; then
            echo "::error::APKEditor merge failed with exit code ${MERGE_EXIT}"
            echo "Files in output/ after failed merge:"
            ls -la output/
            exit ${MERGE_EXIT}
          fi

          echo "Merged APK:"
          ls -la output/merged.apk

      - name: Zipalign and sign the single APK
        run: |
          echo "Zipaligning and signing the merged APK..."

          echo "Debug - checking files:"
          echo "  merged.apk exists: $(ls -la output/merged.apk 2>&1 || true)"
          echo "  valenced.pk8 exists: $(ls -la keys/valenced.pk8 2>&1 || true)"
          echo "  valenced.der exists: $(ls -la keys/valenced.der 2>&1 || true)"
          echo "  keys/ directory contents:"
          ls -la keys/ 2>&1 || true
          echo "  zipalign location: $(which zipalign 2>&1 || echo 'NOT FOUND')"
          echo "  apksigner location: $(which apksigner 2>&1 || echo 'NOT FOUND')"

          # Zipalign (force 4-byte alignment)
          echo "Running zipalign..."
          zipalign -v -f -4 output/merged.apk output/valenced.apk
          echo "zipalign exit code: $?"

          # Sign with apksigner using the same key as Reseam
          echo "Running apksigner sign..."
          apksigner sign --key keys/valenced.pk8 --cert keys/valenced.der output/valenced.apk
          echo "apksigner sign exit code: $?"

          # Verify the signature
          echo "Running apksigner verify..."
          apksigner verify --verbose output/valenced.apk
          echo "apksigner verify exit code: $?"

          echo "Signed single APK:"
          ls -la output/valenced.apk

      - name: Verify output
        run: |
          if [ ! -f output/valenced.apk ]; then
            echo "Error: Single APK was not produced!"
            exit 1
          fi
          echo "Output verification passed."
          ls -la output/valenced.apk
          file output/valenced.apk

      - name: Package single APK
        if: inputs.publish == true || github.event_name == 'release'
        run: |
          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          mkdir -p package

          cp output/valenced.apk "package/valenced.apk"
          cp keys/valenced.pk8 "package/signing.pk8"
          cp keys/valenced.der "package/signing.der"

          printf 'Pre-patched Discord with Valenced\n=================================\n\nValence version: %s\nDiscord version: 352.6 - Alpha\nArchitecture: %s\n\nInstallation:\n  1. Extract valenced.apk from the archive\n  2. Install directly on your Android device:\n     adb install -r valenced.apk\n\n  Or copy the APK to your phone and open it with any file manager.\n\nSigning key:\n  - signing.pk8 / signing.der\n  - Keep these files! You need them to update the app later (same signing key required)\n  - If you lose them, you will need to uninstall and reinstall the app\n\nNotes:\n  - This installs alongside the official Discord app as "Valenced" (package: app.valenced)\n  - Valence version: %s\n' "${VALENCE_VERSION}" "${ARCH}" "${VALENCE_VERSION}" > "package/INSTALL.txt"

          cd package
          zip -r "../${ZIP_NAME}" .

          echo "Package created: ${ZIP_NAME}"
          ls -la "../${ZIP_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: patched-${{ matrix.arch }}
          path: |
            output/valenced.apk
            keys/valenced.pk8
            keys/valenced.der
          if-no-files-found: error

      - name: Upload release asset
        if: inputs.publish == true || github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Finding latest release..."
            TAG_NAME=$(gh release view --limit 1 --json tagName --jq '.tagName' 2>/dev/null || echo "")
            if [ -z "$TAG_NAME" ]; then
              echo "Creating release..."
              TAG_NAME="${VALENCE_VERSION}"
              gh release create "$TAG_NAME" --title "Pre-patched Discord ${VALENCE_VERSION}" --notes "Pre-patched Discord with Valenced ${VALENCE_VERSION}"
            fi
          fi

          echo "Uploading ${ZIP_NAME} to release ${TAG_NAME}..."
          gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber
