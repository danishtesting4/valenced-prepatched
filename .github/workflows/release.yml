name: Release

# Triggers on release publication or manual dispatch
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Valenced release to use
  VALENCE_VERSION: '1.2.3'
  # Discord version code (from Valenced's Discord.kt compatibility declaration)
  DISCORD_VERSION_CODE: '352206'
  # Valenced's patch bundle public key
  BUNDLE_PUBLIC_KEY: 'db74a921941576bf70cc1c2777741fb202131a76758ffd3ffcc785f9e76ff119'
  # Reseam CLI version
  RESEAM_VERSION: '0.30.1'
  DISCORD_MIRROR: 'https://proxy.vd.ushie.dev'
  # Architectures to build (arm64_v8a = most phones, armeabi_v7a = older devices)
  ARCHES: '["arm64_v8a", "armeabi_v7a"]'
  # Java 21 required by LSPatch classes in the Valenced bundle
  JAVA_VERSION: '21'

jobs:
  build-and-release:
    name: Build & release (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(env.ARCHES) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Reseam CLI
        run: |
          echo "Installing Reseam CLI v${RESEAM_VERSION}..."
          wget -q "https://cdn.reseam.app/engine/v${RESEAM_VERSION}/reseam-linux-x64" -O reseam
          chmod +x reseam
          ./reseam --version

      - name: Download Discord APKs
        run: |
          mkdir -p downloads/discord
          cd downloads/discord

          echo "Downloading Discord v${DISCORD_VERSION_CODE} (${{ matrix.arch }})..."
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/base" -O base.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.${{ matrix.arch }}" -O "config.${{ matrix.arch }}.apk"
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.en" -O config.en.apk
          wget -q "${DISCORD_MIRROR}/tracker/download/${DISCORD_VERSION_CODE}/config.xxhdpi" -O config.xxhdpi.apk

          echo "Downloaded Discord APKs:"
          ls -la *.apk

      - name: Download Valenced assets
        run: |
          mkdir -p downloads/valenced
          VALENCE_BASE="https://github.com/Valenced/valenced/releases/download/${VALENCE_VERSION}"

          echo "Downloading Valenced ${VALENCE_VERSION}..."
          wget -q "${VALENCE_BASE}/valenced.reseam" -O downloads/valenced/valenced.reseam
          wget -q "${VALENCE_BASE}/app-release.apk" -O downloads/valenced/app-release.apk

          echo "Downloaded Valenced assets:"
          ls -la downloads/valenced/

      - name: Verify bundle
        run: |
          echo "Verifying Valenced patch bundle..."
          ./reseam bundle list downloads/valenced/valenced.reseam

      - name: Generate signing key
        run: |
          mkdir -p keys
          echo "Generating signing key..."
          ./reseam bundle keygen --out keys/valenced
          echo "Signing key generated:"
          ls -la keys/

      - name: Patch Discord
        run: |
          mkdir -p output

          echo "Patching Discord with Valenced..."
          ./reseam patch downloads/discord/base.apk \
            --split "downloads/discord/config.${{ matrix.arch }}.apk" \
            --split "downloads/discord/config.en.apk" \
            --split "downloads/discord/config.xxhdpi.apk" \
            --bundle "downloads/valenced/valenced.reseam" \
            --trust "${BUNDLE_PUBLIC_KEY}" \
            --preset all \
            --option "Valenced.module=downloads/valenced/app-release.apk" \
            --option "Change package name.packageName=app.valenced" \
            --option "Change app name.appName=Valenced" \
            --key keys/valenced.pk8 \
            --cert keys/valenced.der \
            --output-dir output/

          echo "Patched APKs:"
          ls -la output/

      - name: Package APKs
        run: |
          # The patched output contains split APKs (base.apk, config.{arch}.apk, etc.)
          # Package them into a ZIP file for easy download and installation

          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          # Create a temporary directory for the package
          mkdir -p "package"

          # Copy all patched APKs
          cp output/base.apk "package/base.apk"
          cp output/config.${ARCH}.apk "package/config.${ARCH}.apk"
          cp output/config.en.apk "package/config.en.apk"
          cp output/config.xxhdpi.apk "package/config.xxhdpi.apk"

          # Copy signing keys for future updates
          cp keys/valenced.pk8 "package/signing.pk8"
          cp keys/valenced.der "package/signing.der"

          # Create installation instructions
          cat > "package/INSTALL.txt" << 'EOF'
Pre-patched Discord with Valenced
=================================

Installation:
  1. Extract all APK files to the same folder
  2. Use adb to install:
     adb install-multiple -r *.apk

  Or use an APK installer app like "Split APKs Installer" or "APKMirror Installer"

Signing key:
  - signing.pk8 / signing.der
  - Keep these files! You need them to update the app later (same signing key required)
  - If you lose them, you will need to uninstall and reinstall the app

Notes:
  - This installs alongside the official Discord app as "Valenced" (package: app.valenced)
  - Valence version: 1.2.3
  - Discord version: 352.6 - Alpha
EOF

          # Create the ZIP
          cd package
          zip -r "../${ZIP_NAME}" .
          ls -la "../${ZIP_NAME}"

          echo "Package created: ${ZIP_NAME}"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="${{ matrix.arch }}"
          ZIP_NAME="valenced-discord-${VALENCE_VERSION}-${ARCH}.zip"

          # Determine the release tag from the release event or use the workflow dispatch ref
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          echo "Uploading ${ZIP_NAME} to release ${TAG_NAME}..."
          gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber
